<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Brozing Adventures 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #game{display:block;width:100%;height:100%}
  #ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
  #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fc0;font-size:18px;font-weight:700;text-align:center;z-index:100;padding:24px 32px;background:rgba(0,0,0,.92);border:2px solid #fc0;border-radius:14px;max-width:85vw;line-height:1.5}
  #hud{position:absolute;top:14px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
  .hud-box{background:rgba(10,8,30,.78);border:2px solid rgba(255,204,0,.6);border-radius:10px;padding:7px 14px;color:#fc0;font-weight:700;font-size:14px;letter-spacing:1px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(160deg,rgba(30,12,60,.96),rgba(8,4,24,.98));border:2px solid rgba(255,204,0,.65);border-radius:18px;padding:30px 40px;text-align:center;color:#fff;max-width:90vw;max-height:92vh;overflow-y:auto;pointer-events:auto;box-shadow:0 0 60px rgba(255,204,0,.25),0 20px 60px rgba(0,0,0,.7)}
  .hidden{display:none!important}
  .title{font-size:38px;font-weight:900;color:#fc0;text-shadow:0 4px 0 #7a3b00,0 8px 30px rgba(255,204,0,.5);letter-spacing:2px;margin-bottom:2px;line-height:1.1}
  .title-pink{color:#ff6fd8;text-shadow:0 4px 0 #6b1a5e,0 8px 30px rgba(255,111,216,.5)}
  .subtitle{color:#9a8ad0;font-size:12px;letter-spacing:5px;margin-bottom:22px;text-transform:uppercase}
  .btn{display:block;width:260px;margin:10px auto;padding:13px 18px;font-family:inherit;font-size:17px;font-weight:800;color:#1a0a30;background:linear-gradient(180deg,#ffe066,#ffcc00 55%,#e6a800);border:none;border-radius:12px;cursor:pointer;letter-spacing:2px;box-shadow:0 6px 0 #8a5a00,0 10px 24px rgba(255,204,0,.3);transition:transform .1s,filter .1s}
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #8a5a00}
  .btn-pink{background:linear-gradient(180deg,#ff9fe0,#ff6fd8 55%,#c93a9e);box-shadow:0 6px 0 #7a1f6e,0 10px 24px rgba(255,111,216,.3)}
  .btn-pink:active{box-shadow:0 1px 0 #7a1f6e}
  .instructions{color:#b8b0e0;font-size:12px;margin-top:16px;line-height:1.8}
  .instructions kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:2px 7px;font-family:inherit;font-size:11px;color:#fc0}
  .big-msg{font-size:32px;font-weight:900;margin-bottom:10px;letter-spacing:2px}
  .gold{color:#fc0;text-shadow:0 4px 0 #7a3b00}
  .red{color:#ff4d6d;text-shadow:0 4px 0 #6b0018}
  .green{color:#00e676;text-shadow:0 4px 0 #005c2e}
  .small-msg{color:#c9c0f0;font-size:15px;margin-bottom:16px;line-height:1.5}
  #controls{position:absolute;bottom:18px;left:0;width:100%;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
  #controls.active{display:flex}
  .group{display:flex;gap:12px}
  .ctrl-btn{pointer-events:auto;width:62px;height:62px;background:rgba(255,204,0,.2);border:2px solid rgba(255,204,0,.6);border-radius:50%;color:#fc0;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
  .ctrl-btn:active{background:rgba(255,204,0,.5)}
  @media(max-height:600px){.panel{padding:18px 22px}.title{font-size:26px}.subtitle{font-size:9px;margin-bottom:12px;letter-spacing:3px}.btn{padding:9px 14px;font-size:14px;margin:6px auto;width:210px}.instructions{font-size:10px;margin-top:10px}.big-msg{font-size:22px}.small-msg{font-size:13px}.hud-box{font-size:11px;padding:4px 9px}.ctrl-btn{width:50px;height:50px;font-size:17px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div class="hud-box" id="hud-level">FASE 1</div>
    <div class="hud-box">❤ <span id="hud-lives">3</span></div>
    <div class="hud-box">◆ <span id="hud-score">0</span></div>
  </div>

  <div id="menu" class="panel">
    <div class="title">BROZING</div>
    <div class="title title-pink">ADVENTURES 3D</div>
    <div class="subtitle">Uma nova dimensão</div>
    <button class="btn" id="btn-play">▶ JOGAR</button>
    <div class="instructions">
      <kbd>A</kbd> <kbd>D</kbd> mover · <kbd>Espaço</kbd>/<kbd>W</kbd> pular<br>
      Pule em cima dos inimigos · Colete os cristais
    </div>
  </div>

  <div id="intro" class="panel hidden">
    <div class="big-msg gold" id="intro-title">FASE 1</div>
    <div class="small-msg" id="intro-sub">Pomar Digital</div>
    <button class="btn" id="btn-start">COMEÇAR</button>
  </div>

  <div id="gameover" class="panel hidden">
    <div class="big-msg red">FIM DE JOGO</div>
    <div class="small-msg">Pontuação: <span id="go-score">0</span></div>
    <button class="btn" id="btn-retry">TENTAR NOVAMENTE</button>
    <button class="btn btn-pink" id="btn-menu-go">MENU</button>
  </div>

  <div id="victory" class="panel hidden">
    <div class="big-msg green">VITÓRIA!</div>
    <div class="small-msg">Você completou as 3 fases!</div>
    <div class="small-msg">Pontuação final: <span id="vic-score">0</span></div>
    <button class="btn" id="btn-again">JOGAR NOVAMENTE</button>
    <button class="btn btn-pink" id="btn-menu-vic">MENU</button>
  </div>

  <div id="controls">
    <div class="group">
      <div class="ctrl-btn" id="ctrl-left">◀</div>
      <div class="ctrl-btn" id="ctrl-right">▶</div>
    </div>
    <div class="ctrl-btn" id="ctrl-jump">▲</div>
  </div>
</div>
<div id="loading">Carregando Three.js...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var loading = document.getElementById('loading');

  // Global safety net
  window.addEventListener('error', function (e) {
    if (loading && loading.style.display !== 'none') {
      loading.innerHTML = '❌ Erro: ' + (e.message || 'desconhecido');
    }
  });

  if (typeof THREE === 'undefined' || !THREE.WebGLRenderer) {
    loading.innerHTML = '❌ Falha ao carregar Three.js.<br>Verifique a internet e recarregue.';
    return;
  }

  try {
    // ============================================================
    // CONFIG
    // ============================================================
    var GRAVITY = -30;
    var JUMP_VEL = 13;
    var MOVE_SPEED = 8;
    var MOVE_ACCEL = 65;
    var FRICTION = 0.82;
    var PW = 0.6, PH = 1.6;
    var COYOTE = 0.1, JBUF = 0.12, INVULN = 1.5;
    var KILL_Y = -15;

    // ============================================================
    // LEVELS — 3 phases
    // ============================================================
    var LEVELS = [
      {
        name: 'POMAR DIGITAL',
        theme: { sky: 0x87ceeb, fog: 0xa8d8ff, ground: 0x4a9c4a, grass: 0x5cb85c, plat: 0xb87a3f },
        startX: -30, startY: 1.3, goalX: 60,
        platforms: [
          { x: -30, y: 0,   w: 20, h: 1,   d: 6 },
          { x: -15, y: 2.5, w: 4,  h: 0.5, d: 4 },
          { x: -5,  y: 4.5, w: 4,  h: 0.5, d: 4 },
          { x: 5,   y: 2.5, w: 4,  h: 0.5, d: 4 },
          { x: 17,  y: 0,   w: 14, h: 1,   d: 6 },
          { x: 30,  y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: 40,  y: 5.5, w: 4,  h: 0.5, d: 4 },
          { x: 50,  y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: 60,  y: 0,   w: 14, h: 1,   d: 6 }
        ],
        coins: [
          { x: -15, y: 4 }, { x: -5, y: 6 }, { x: 5, y: 4 },
          { x: 30, y: 4.5 }, { x: 40, y: 7 }, { x: 50, y: 4.5 },
          { x: 17, y: 3 }, { x: 60, y: 3 }
        ],
        enemies: [
          { x: 17, y: 0.9, minX: 11, maxX: 23, speed: 2.5, type: 'apple' },
          { x: 60, y: 0.9, minX: 54, maxX: 66, speed: 2.2, type: 'pear' }
        ]
      },
      {
        name: 'VINHEDO CÓSMICO',
        theme: { sky: 0xff8a65, fog: 0xffab91, ground: 0xc2634a, grass: 0xd97860, plat: 0xc98a4b },
        startX: -30, startY: 1.3, goalX: 68,
        platforms: [
          { x: -30, y: 0,   w: 18, h: 1,   d: 6 },
          { x: -16, y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: -6,  y: 5.5, w: 4,  h: 0.5, d: 4 },
          { x: 4,   y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: 16,  y: 0,   w: 14, h: 1,   d: 6 },
          { x: 30,  y: 4,   w: 4,  h: 0.5, d: 4 },
          { x: 42,  y: 6.5, w: 4,  h: 0.5, d: 4 },
          { x: 54,  y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: 68,  y: 0,   w: 14, h: 1,   d: 6 }
        ],
        coins: [
          { x: -16, y: 4.5 }, { x: -6, y: 7 }, { x: 4, y: 4.5 },
          { x: 30, y: 5.5 }, { x: 42, y: 8 }, { x: 54, y: 4.5 },
          { x: 16, y: 3 }, { x: 68, y: 3 }
        ],
        enemies: [
          { x: 16, y: 0.9, minX: 10, maxX: 22, speed: 2.8, type: 'grape' },
          { x: 68, y: 0.9, minX: 62, maxX: 74, speed: 2.5, type: 'apple' }
        ]
      },
      {
        name: 'CIBERESCRITÓRIO',
        theme: { sky: 0x0d0221, fog: 0x1a0a3a, ground: 0x2a1a5a, grass: 0x3a2a7a, plat: 0x5a3a8a },
        startX: -30, startY: 1.3, goalX: 76,
        platforms: [
          { x: -30, y: 0,   w: 18, h: 1,   d: 6 },
          { x: -14, y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: -4,  y: 6,   w: 4,  h: 0.5, d: 4 },
          { x: 6,   y: 3,   w: 4,  h: 0.5, d: 4 },
          { x: 18,  y: 0,   w: 14, h: 1,   d: 6 },
          { x: 33,  y: 4,   w: 4,  h: 0.5, d: 4 },
          { x: 45,  y: 7,   w: 4,  h: 0.5, d: 4 },
          { x: 56,  y: 4,   w: 4,  h: 0.5, d: 4 },
          { x: 76,  y: 0,   w: 18, h: 1,   d: 6 }
        ],
        coins: [
          { x: -14, y: 4.5 }, { x: -4, y: 7.5 }, { x: 6, y: 4.5 },
          { x: 33, y: 5.5 }, { x: 45, y: 8.5 }, { x: 56, y: 5.5 },
          { x: 18, y: 3 }, { x: 76, y: 3 }
        ],
        enemies: [
          { x: 18, y: 0.9, minX: 12, maxX: 24, speed: 3.0, type: 'mouse' },
          { x: 76, y: 0.9, minX: 68, maxX: 84, speed: 3.2, type: 'keyboard' }
        ]
      }
    ];

    // ============================================================
    // THREE.JS SETUP
    // ============================================================
    var canvas = document.getElementById('game');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    var camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(-30, 4, 12);

    // Lights
    var ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    var hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
    scene.add(hemi);

    var dir = new THREE.DirectionalLight(0xfff5e0, 1.2);
    dir.position.set(15, 30, 15);
    dir.castShadow = true;
    dir.shadow.mapSize.width = 2048;
    dir.shadow.mapSize.height = 2048;
    dir.shadow.camera.left = -40;
    dir.shadow.camera.right = 40;
    dir.shadow.camera.top = 40;
    dir.shadow.camera.bottom = -40;
    dir.shadow.camera.near = 1;
    dir.shadow.camera.far = 100;
    dir.shadow.bias = -0.0005;
    scene.add(dir);
    scene.add(dir.target);

    // ============================================================
    // HELPERS
    // ============================================================
    function makeMat(color, opts) {
      opts = opts || {};
      return new THREE.MeshStandardMaterial({
        color: color,
        roughness: opts.roughness !== undefined ? opts.roughness : 0.6,
        metalness: opts.metalness || 0,
        emissive: opts.emissive || 0x000000,
        emissiveIntensity: opts.emissiveIntensity || 0
      });
    }

    // ============================================================
    // PLAYER MESH  (spans -0.8 to +0.8 in Y)
    // ============================================================
    function createPlayerMesh() {
      var g = new THREE.Group();
      var legMat = makeMat(0x2b5fce);
      var bodyMat = makeMat(0xe63946);
      var skinMat = makeMat(0xffd7a8);
      var capMat = makeMat(0xffd93d);

      var legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.35), legMat);
      legL.position.set(-0.15, -0.4, 0);
      legL.castShadow = true;
      g.add(legL);

      var legR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.35), legMat);
      legR.position.set(0.15, -0.4, 0);
      legR.castShadow = true;
      g.add(legR);

      var body = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.5, 0.42), bodyMat);
      body.position.set(0, 0.15, 0);
      body.castShadow = true;
      g.add(body);

      var head = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.3, 0.42), skinMat);
      head.position.set(0, 0.55, 0);
      head.castShadow = true;
      g.add(head);

      var cap = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.1, 0.48), capMat);
      cap.position.set(0, 0.75, 0);
      cap.castShadow = true;
      g.add(cap);

      var eyeMat = makeMat(0x1a1a1a);
      var eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.05), eyeMat);
      eyeL.position.set(-0.11, 0.6, 0.22);
      g.add(eyeL);

      var eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.05), eyeMat);
      eyeR.position.set(0.11, 0.6, 0.22);
      g.add(eyeR);

      g.userData = { legL: legL, legR: legR };
      return g;
    }

    // ============================================================
    // ENEMY MESHES
    // ============================================================
    function createEnemyMesh(type) {
      var g = new THREE.Group();

      if (type === 'apple') {
        var bodyA = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12), makeMat(0xe0201f, { roughness: 0.4 }));
        bodyA.position.y = 0.4;
        bodyA.castShadow = true;
        g.add(bodyA);
        var stemA = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.15, 6), makeMat(0x4a2a1a));
        stemA.position.y = 0.85;
        g.add(stemA);
        var eyeWA = makeMat(0xffffff);
        var eAL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), eyeWA);
        eAL.position.set(-0.12, 0.5, 0.35);
        g.add(eAL);
        var eAR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), eyeWA);
        eAR.position.set(0.12, 0.5, 0.35);
        g.add(eAR);
        var pupA = makeMat(0x000000);
        var pAL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 4), pupA);
        pAL.position.set(-0.12, 0.5, 0.4);
        g.add(pAL);
        var pAR = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 4), pupA);
        pAR.position.set(0.12, 0.5, 0.4);
        g.add(pAR);
      } else if (type === 'grape') {
        var grapeMat = makeMat(0x7a3fc2, { roughness: 0.4, metalness: 0.1 });
        var pts = [[0,0.6,0],[0.15,0.45,0],[-0.15,0.45,0],[0,0.35,0],[0.1,0.2,0],[-0.1,0.2,0],[0,0.1,0]];
        for (var i = 0; i < pts.length; i++) {
          var s = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), grapeMat);
          s.position.set(pts[i][0], pts[i][1], pts[i][2]);
          s.castShadow = true;
          g.add(s);
        }
        var eyeWG = makeMat(0xffffff);
        var eGL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), eyeWG);
        eGL.position.set(-0.1, 0.5, 0.2);
        g.add(eGL);
        var eGR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), eyeWG);
        eGR.position.set(0.1, 0.5, 0.2);
        g.add(eGR);
      } else {
        var col = type === 'pear' ? 0xb7d63a : (type === 'keyboard' ? 0x2c2c34 : 0xd8d8e0);
        var body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.55, 0.7), makeMat(col, { roughness: 0.5 }));
        body.position.y = 0.4;
        body.castShadow = true;
        g.add(body);
        var eyeMat = makeMat(0xff3344, { emissive: 0xaa0022, emissiveIntensity: 0.5 });
        var eL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.05), eyeMat);
        eL.position.set(-0.15, 0.5, 0.36);
        g.add(eL);
        var eR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.05), eyeMat);
        eR.position.set(0.15, 0.5, 0.36);
        g.add(eR);
      }
      return g;
    }

    // ============================================================
    // COIN MESH
    // ============================================================
    function createCoinMesh() {
      var mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.32, 0),
        makeMat(0xffcc00, { metalness: 0.85, roughness: 0.2, emissive: 0x553300, emissiveIntensity: 0.5 })
      );
      mesh.castShadow = true;
      return mesh;
    }

    // ============================================================
    // GOAL MESH
    // ============================================================
    function createGoalMesh() {
      var g = new THREE.Group();
      var pole = new THREE.Mesh(new THREE.BoxGeometry(0.15, 4, 0.15), makeMat(0x999999, { metalness: 0.6, roughness: 0.4 }));
      pole.position.y = 2;
      pole.castShadow = true;
      g.add(pole);
      var flag = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.06), makeMat(0x00e676, { emissive: 0x004411, emissiveIntensity: 0.4 }));
      flag.position.set(0.65, 3.3, 0);
      flag.castShadow = true;
      g.add(flag);
      var ball = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), makeMat(0xffcc00, { metalness: 0.8, roughness: 0.2 }));
      ball.position.y = 4.05;
      g.add(ball);
      return g;
    }

    // ============================================================
    // GAME STATE
    // ============================================================
    var state = 'menu'; // menu | intro | playing | gameover | victory
    var score = 0;
    var lives = 3;
    var currentLevel = 0;

    var levelRoot = null;
    var playerMesh = null;
    var goalMesh = null;
    var solids = [];
    var coins = [];
    var enemies = [];
    var particles = [];
    var goal = null;

    var player = {
      x: 0, y: 0, z: 0,
      vx: 0, vy: 0,
      onGround: false,
      coyote: 0,
      facing: 1,
      walkPhase: 0,
      invuln: 0
    };

    var input = { left: false, right: false, jumpBuf: 0 };

    // ============================================================
    // CLEAR / BUILD LEVEL
    // ============================================================
    function clearLevel() {
      if (levelRoot) {
        scene.remove(levelRoot);
        levelRoot.traverse(function (o) {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); });
            else o.material.dispose();
          }
        });
      }
      levelRoot = new THREE.Group();
      scene.add(levelRoot);

      if (playerMesh) {
        scene.remove(playerMesh);
        playerMesh.traverse(function (o) {
          if (o.geometry) o.geometry.dispose();
          if (o.material) o.material.dispose();
        });
        playerMesh = null;
      }

      // Clean particles
      for (var i = 0; i < particles.length; i++) {
        scene.remove(particles[i].mesh);
        particles[i].mesh.geometry.dispose();
        particles[i].mesh.material.dispose();
      }
      particles = [];

      solids = [];
      coins = [];
      enemies = [];
      goal = null;
    }

    function buildLevel(index) {
      clearLevel();
      var lvl = LEVELS[index];

      scene.background = new THREE.Color(lvl.theme.sky);
      scene.fog = new THREE.Fog(lvl.theme.fog, 30, 80);
      hemi.color = new THREE.Color(lvl.theme.sky);
      hemi.groundColor = new THREE.Color(lvl.theme.ground);
      dir.target.position.set(lvl.startX + 20, 0, 0);

      var i, p, mp, c, e;

      // Platforms
      for (i = 0; i < lvl.platforms.length; i++) {
